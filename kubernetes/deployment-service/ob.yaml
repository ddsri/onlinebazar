apiVersion: apps/v1
kind: Deployment
metadata:
  name: ob
  labels:
    app: ob
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ob
  template:
    metadata:
      labels:
        app: ob
    spec:
      containers:
      - name: ob-webapp
        image: ob:20260221
        resources:
          requests:
            cpu: "300m"
            memory: "256Mi"
          limits:
            cpu: "600m"
            memory: "512Mi"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ob
spec:
  type: NodePort
  selector:
    app: ob
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30100